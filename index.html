}

/* vendor-prefixed + standard placeholder reset */
.field input::-webkit-input-placeholder { color: transparent; }

.field textarea::-webkit-input-placeholder { color: transparent; }
.field textarea::placeholder             { color: transparent; }

.field.wide label { top: 1rem; }

.field label {
  position: absolute;
  left: 0;
  top: 50%;
  font-size: 0.85rem;

  color: #aaa;
  pointer-events: none;
  -webkit-transform-origin: left center;

}

/* ── active / filled state ── */
.field input:focus ~ label,
.field input:not(:placeholder-shown) ~ label,
.field textarea:focus ~ label,
.field textarea:not(:placeholder-shown) ~ label {
  top: 0;
  font-size: 0.6rem;
  color: #999;

  :root {
    --not-found-paper: #f6f1eb;

body:has([data-namespace='notFound']){
  --page-bg: var(--not-found-dark);
    --page-text: var(--not-found-dark-ink);
    --page-link: rgba(10, 10, 10, 0.78);
    margin: 0;
    min-height: 100svh;
    overflow: hidden;
    color: var(--page-text);
    background: var(--page-bg);
}


.not-found-shell {
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 2rem;
}

.not-found {
    display: grid;
    justify-items: center;
    gap: 1.6rem;
    transform: translateY(1.5vh);
}

.not-found__code {
    display: inline-flex;
    align-items: center;
    gap: 0;
    font-size: 18rem;
    font-weight: 400;
    letter-spacing: -0.08em;
    line-height: 0.84;
}

.not-found__digit {
    display: block;
}

.not-found__digit--clock {
    position: relative;
    display: grid;
    place-items: center;
    width: 0.82em;
    height: 1em;
    margin-inline: -0.05em;
}

.not-found__zero {
    position: relative;
    z-index: 1;
}

.not-found__clock {
    position: absolute;
    z-index: 2;
    width: 0.34em;
    height: 0.34em;
    border-radius: 50%;
    transform: translate(0.022em, 0.03em);
}

.not-found__hand {
    position: absolute;
    left: 50%;
    top: 50%;
    height: 0.006em;
    border-radius: 999px;
    background: currentColor;
    transform-origin: 0 50%;
    translate: 0 -50%;
}

.not-found__hand--hour {
    width: 0.125em;
    transform: rotate(32deg);
}

.not-found__hand--minute {
    width: 0.19em;
    transform: rotate(-66deg);
}

.not-found__message {
    margin: 0;
    font-size: 1.5rem;
    font-weight: 400;
    letter-spacing: -0.025em;
    line-height: 1;
}

.not-found__link {
    color: var(--page-link);
    font-size: 1.15rem;
    font-weight: 400;
    letter-spacing: -0.03em;
    text-underline-offset: 0.22em;
    text-decoration-thickness: 0.05em;
}

.not-found__link:hover,
.not-found__link:focus-visible {
    outline: none;
}

.sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
}
